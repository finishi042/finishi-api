name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: finishi-waitlist
  REGION: us-central1
  SERVICE_NAME: finishi-api
  REPOSITORY_NAME: finishi-api

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          IMAGE_URL_LATEST="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:latest"
          
          docker build -t $IMAGE_URL -t $IMAGE_URL_LATEST .
          docker push $IMAGE_URL
          docker push $IMAGE_URL_LATEST

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --port=3000
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=10
            --timeout=60s
          env_vars: |
            NODE_ENV=production
            PORT=3000
            LOG_LEVEL=info
          secrets: |
            SUPABASE_URL=supabase-url:latest
            SUPABASE_ANON_KEY=supabase-anon-key:latest
            SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest
            SUPABASE_JWT_SECRET=supabase-jwt-secret:latest
            ALLOWED_ORIGINS=allowed-origins:latest

      - name: Show deployment URL
        run: |
          echo "Service deployed to: ${{ steps.deploy.outputs.url }}"
          
      - name: Test deployment
        run: |
          sleep 5
          curl -f ${{ steps.deploy.outputs.url }}/health || exit 1
